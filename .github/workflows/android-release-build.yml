# Builds the JulineMart Android release bundle (AAB) and keeps it as a workflow
# artifact. It does not upload to Google Play; Play uploads stay manual until
# the closed-testing deploy job is added (see docs/android-release-automation.md).
#
# Secrets (repository or "android-release" environment):
#   GOOGLE_SERVICES_JSON_BASE64   android/app/google-services.json, base64
#   ANDROID_KEYSTORE_BASE64       the existing upload keystore, base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release build (artifact only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode: higher than every code already on Play (any track). Check Play Console first."
        required: true
        type: string
      version_name:
        description: "versionName shown to users, e.g. 1.2"
        required: true
        type: string
      signing:
        description: "signed = signed with the upload keystore; unsigned = pipeline dry run, not uploadable"
        required: true
        default: signed
        type: choice
        options:
          - signed
          - unsigned

permissions:
  contents: read

concurrency:
  group: android-release-build
  cancel-in-progress: false

env:
  # SHA-256 of the UPLOAD certificate: the key we sign AABs with before sending
  # them to Play, read from the v1.1 AAB uploaded in May 2026. It is not Google's
  # app-signing certificate, which only appears on APKs that Play generates.
  # Public fingerprint, not a secret. A signed build with any other key fails.
  EXPECTED_UPLOAD_CERT_SHA256: "5E:76:81:3F:30:AD:5C:2E:CB:00:CF:1B:3C:B8:F8:49:C5:CB:26:A8:FA:E4:A3:E4:08:9C:3B:43:FA:D7:FB:0D"
  EXPECTED_FIREBASE_PROJECT: julinemart-app

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - name: Check inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          [[ "$VERSION_CODE" =~ ^[0-9]{1,10}$ ]] || { echo "::error::version_code must be a whole number"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,49}$ ]] || { echo "::error::version_name has invalid characters"; exit 1; }
          # Gradle also rejects codes below the checked-in versionCode.

      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      # Each pinned action.yml was checked: node24 runtime, inputs as used here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which rejects package-lock.json because of the
      # brace-expansion overrides in package.json. npm 11 accepts it, and the
      # lock file is maintained with 11.9.0, so CI uses that exact version.
      # Remove this step once the overrides work with npm 10 too.
      - name: Use npm 11.9.0
        run: |
          npm install --global npm@11.9.0
          [ "$(npm --version)" = "11.9.0" ] || { echo "::error::npm is $(npm --version), expected 11.9.0"; exit 1; }

      # postinstall runs scripts/fix-capacitor-proguard.js, which the Android
      # build depends on, so scripts stay enabled.
      - name: Install npm dependencies
        run: npm ci

      # The app loads https://julinemart.com (capacitor.config.ts server.url),
      # so the bundled web assets are never shown. `next build` does not write
      # to out/ (no static export), and the published v1.1 bundle shipped with
      # no index.html at all. `cap sync` only needs out/index.html to exist, so
      # this recreates the exact 41-byte file used for local release builds and
      # checks its hash, keeping CI output identical to the local process.
      - name: Prepare Capacitor web directory
        run: |
          mkdir -p out
          printf '<!doctype html><title>JulineMart</title>\n' > out/index.html
          echo "60453b32e93e832180db4c7544493e275d71fbb0ac9d3d0f8cd72cd3cdb65d37  out/index.html" | sha256sum --check

      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The open-source cache on GitHub Actions cache, not the default
          # commercial "enhanced" provider. Build scans and dependency-graph
          # submission are off by default and stay off.
          cache-provider: basic

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] || { echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Validate google-services.json
        working-directory: android
        env:
          JULINEMART_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew :app:validateGoogleServicesJson

      - name: Write upload keystore
        if: inputs.signing == 'signed'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Missing secrets:$missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build release bundle
        working-directory: android
        env:
          JULINEMART_VERSION_CODE: ${{ inputs.version_code }}
          JULINEMART_VERSION_NAME: ${{ inputs.version_name }}
          # Empty for unsigned runs, so Gradle leaves the bundle unsigned.
          JULINEMART_KEYSTORE_FILE: ${{ inputs.signing == 'signed' && format('{0}/upload.keystore', runner.temp) || '' }}
          JULINEMART_KEYSTORE_PASSWORD: ${{ inputs.signing == 'signed' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          JULINEMART_KEY_ALIAS: ${{ inputs.signing == 'signed' && secrets.ANDROID_KEY_ALIAS || '' }}
          JULINEMART_KEY_PASSWORD: ${{ inputs.signing == 'signed' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew :app:bundleRelease

      - name: Verify upload certificate
        if: inputs.signing == 'signed'
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          actual=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
          if [ "$actual" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "::error::Bundle is signed with $actual, expected $EXPECTED_UPLOAD_CERT_SHA256"
            exit 1
          fi
          echo "Upload certificate matches."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: julinemart-${{ inputs.signing }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" android/app/google-services.json
