<!--
  Supabase "Confirm signup" email template.
  Paste into: Supabase dashboard -> Authentication -> Email Templates -> Confirm signup
  Subject:    Confirm your JulineMart account
  Uses {{ .ConfirmationURL }} (Supabase fills it in; it returns to /auth/confirmed).
  Inline styles only, table layout, so it renders in Gmail/Outlook/Apple Mail.
-->
<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="font-size:22px;font-weight:700;padding-bottom:16px;">JulineMart</td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:700;padding-bottom:12px;">Confirm your email</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:22px;color:#3f3f46;padding-bottom:24px;">
                Thanks for signing up. Tap the button below to confirm
                <strong>{{ .Email }}</strong> and finish setting up your account.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#16a34a;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:999px;">
                  Confirm my email
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:19px;color:#71717a;padding-bottom:16px;">
                Button not working? Copy this link into your browser:<br />
                <span style="word-break:break-all;">{{ .ConfirmationURL }}</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;line-height:18px;color:#a1a1aa;border-top:1px solid #e4e4e7;padding-top:16px;">
                If you did not create a JulineMart account, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
